<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagata Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background-color: #111;
            color: #d4af37;
            padding: 20px;
        }
        .container {
            padding: 20px;
        }
        .product-card {
            background: white;
            margin: 20px auto;
            padding: 15px;
            border-radius: 10px;
            max-width: 400px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SWAGATA COLLECTION</h1>
        <p>COLLECTION • MEN'S WEAR</p>
    </header>

    <div class="container">
        <h2>Swagata Collection</h2>
        <p>Men's fashion ke liye stylish aur premium collection.</p>

        <!-- Pehla Product -->
        <div class="product-card">
            <h3>Blue Formal Shirt</h3>
            <img src="product-1.jpg" alt="Blue Formal Shirt">
        </div>

        <!-- Doosra Product -->
        <div class="product-card">
            <h3>Stylish Product</h3>
            <img src="product-2.jpg" alt="Product Image">
        </div>
    </div>

</body>
</html>
